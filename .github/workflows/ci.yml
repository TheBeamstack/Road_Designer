name: CI

# The tests and the React build, on every PR and on main (`scripts/verify.sh`, the lane's gate).
# A public repo, so GitHub-hosted runners (diwan RULINGS R70). It deploys nothing.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests and build
        run: bash scripts/verify.sh
