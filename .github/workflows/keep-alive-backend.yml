name: Keep-alive — FastAPI backend

# Pings the deployed backend's /health endpoint every ~12 minutes to reduce
# cold starts on hosts that sleep idle services. It does NOT deploy anything.
#
# Setup: repo Settings -> Secrets and variables -> Actions -> New repository secret
#   Name:  BACKEND_HEALTH_URL
#   Value: https://<your-space>.hf.space/health
#
# WHICH HOSTS THIS HELPS:
#   - Hugging Face Spaces on `CPU Basic` (this project's current host, see
#     DEPLOYMENT.md Part A/E): yes, recommended — CPU Basic sleeps after a fixed
#     48h of inactivity with no way to configure that timeout, and pinging it
#     costs nothing extra (PRO is a flat monthly fee; CPU Basic hours are
#     $0/hour regardless of how continuously they're used). Render / Koyeb free
#     tiers: same idea, also safe.
#   - Google Cloud Run deployed with `--no-cpu-throttling` (DEPLOYMENT.md's
#     documented later-promotion path, Part G, NOT the current host): DO NOT
#     set the secret if/when running there. CPU-always-allocated means a
#     kept-warm instance is billed continuously and would blow the free monthly
#     allotment. Leave it to scale to zero and accept the first-request cold
#     start instead.
# If the secret is unset the job no-ops (it will not fail your checks).

on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Curl the backend health endpoint
        run: |
          if [ -z "${{ secrets.BACKEND_HEALTH_URL }}" ]; then
            echo "BACKEND_HEALTH_URL secret is not set — skipping ping." \
                 "Recommended: set it to the current Hugging Face Space's" \
                 "/health URL (DEPLOYMENT.md Part E) — free to run there." \
                 "Do not point it at a Cloud Run deployment with" \
                 "--no-cpu-throttling. See the comment at the top of this file."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 20 \
               "${{ secrets.BACKEND_HEALTH_URL }}"
