# docs/MILESTONES.toml — this lane's releases and milestones: what it builds towards, and by when.
#
# ════════════════════════════════════════════════════════════════════════════════════════════════
#  HOW TO EDIT THIS FILE
# ════════════════════════════════════════════════════════════════════════════════════════════════
#
# The steward copies this file from diwan `docs/MILESTONES-TEMPLATE.toml` to `.agent.toml [paths]
# milestones` (default `docs/MILESTONES.toml`, beside the decisions file) and proposes releases and milestones
# in it. The owner approves one by writing the day's date in its `approved` line, on GitHub (pencil icon →
# "Commit directly to the main branch"). Once a day diwan copies every approved block into its
# `docs/owner/ROADMAP.toml`, where the owner weighs each release, and the lane (its share of the accounts).
# Check this file on the lane's checkout with:   python3 $DIWAN/scripts/owner_files.py check --lane <repo>
#
# Who writes what: the steward appends a block with `approved = ""` (at most 2 releases and 3 milestones
# open at once) and edits
# only such blocks; the owner may edit any field, and alone writes `approved` and `dropped`. A change to
# an approved block is not copied until the owner writes a new date in its `approved` line (`dropped`
# excepted): until then ROADMAP keeps the approved copy and the digest says what changed, once.
#
# Two levels. A [[milestone]] is a set of tasks; a [[release]] (e.g. "v1.0 production-ready") is a set of
# milestones. The lane's ACTIVE milestone is the first approved milestone, top to bottom, not dropped or done,
# of its release the owner weighs highest in ROADMAP.toml (all equal: the first release in this file; a milestone
# with no release, after the releases); its steward builds from it first. To change the sequence, move the blocks.
#
# A [[release]] has the milestone fields below but `size`; its `covers` lists its milestones, "M-<lane>-NN",
# and each of them names it in a `release` line. Its id is "R-<lane>-NN"; it is done when they all are and
# its `done_when` checks pass.
#
#   id         "M-<lane>-NN": the lane's name in diwan docs/lanes.toml and the next two-digit number; never reuse one.
#   release    optional: the id of the release it belongs to; without one it is reported under "no release".
#   portfolio  "beamstack" or "revenue" (the apps that fund Beamstack): which folder of the
#              progress record it is reported in.
#   goal       one line: the result, not a task list.
#   done_when  extra checks beyond "every covered task is done"; [] = none. Each is one of:
#                "task:<repo>#T-nnn"   that task's row is done on main
#                "epic:X-nnn"          every child of that CROSS.md epic is done
#                "tag:<repo>@<name>"   that tag exists
#                "file:<repo>:<path>"  that file exists on main
#                "owner:<sentence>"    the owner confirms it when everything else is done
#   covers     the tasks it is made of: "T-nnn" (this lane), "<repo>#T-nnn" or "X-nnn". The steward
#              may add more later by tagging a task with the milestone; the report shows it.
#   due        "YYYY-MM-DD", the target date; later than the day it was approved.
#   size       how many tasks it should take, 1 to 50; the progress % never counts fewer.
#   approved   "" while proposed; the owner's "YYYY-MM-DD" once approved.
#   dropped    optional, owner only; a reason, e.g. "superseded by M-bunyan-03". A dropped one is never active.
#
# ── EXAMPLES ─────────────────────────────────────────────────────────────────────────────────────
#
# Propose a release and its milestone (steward) — paste the blocks at the end of the file and fill them in:
#
#     [[release]]
#     id = "R-bunyan-01"
#     portfolio = "beamstack"
#     goal = "v1.0 production-ready"
#     done_when = ["tag:Bunyan@v1.0.0"]
#     covers = ["M-bunyan-01"]
#     due = "2026-12-20"
#     approved = ""
#
#     [[milestone]]
#     id = "M-bunyan-01"
#     release = "R-bunyan-01"
#     portfolio = "beamstack"
#     goal = "the D29 cache ships in a release candidate"
#     done_when = ["tag:Bunyan@v1.0.0-rc1"]
#     covers = ["T-038", "T-039", "T-040", "T-041", "T-042", "T-043", "T-044", "T-045"]
#     due = "2026-11-30"
#     size = 8
#     approved = ""
#
# Approve it (owner) — write today's date:
#
#     approved = "2026-10-23"
#
# Move a date (owner) — change `due`, and write today's date in `approved` so the change is copied:
#
#     due = "2026-12-15"
#     approved = "2026-11-02"
#
# Drop it (owner) — add a `dropped` line with the reason; the next block becomes active:
#
#     dropped = "replaced by the native renderer"
#
# ── COMMON MISTAKES (each one is refused, with the line number) ─────────────────────────────────
#
#   id = "M-bunyan-1" or "bunyan-01" → "M-<lane>-NN" with this lane's name and two digits.
#   the same id twice                → each milestone has its own id.
#   lane = "bunyan" or weight = 4    → not here: the lane is this repo's, the weight is in diwan's ROADMAP.toml.
#   portfolio = "Beamstack"          → "beamstack" or "revenue", lower case.
#   done_when = ["tests pass"]       → only the five kinds of check above.
#   covers = "T-041"                 → a list in brackets, even for one: ["T-041"].
#   covers = [41]                    → each task in quotes, with its T-: "T-041".
#   due = "30/11/2026"               → "YYYY-MM-DD".
#   approved = "yes"                 → "" or "YYYY-MM-DD".
#   due on or before `approved`      → a target date is later than its approval.
#   size = 0                         → a whole number 1 to 50.
#   a 4th block with approved = ""   → at most 3 milestone proposals open at once, and 2 release ones.
#   covers = ["M-bunyan-01"] without release = "R-bunyan-01" in M-bunyan-01 → each names the other, or neither.
#   a block without its [[milestone]] line → each block starts with [[milestone]].
#
# ════════════════════════════════════════════════════════════════════════════════════════════════

[[release]]
id = "R-roaddesigner-01"
portfolio = "beamstack"
goal = "V1.0.0: live at rd.beam-stack.com, locked, tested, fast, and never looks stuck"
done_when = ["tag:Road_Designer@v1.0.0"]
covers = ["M-roaddesigner-01", "M-roaddesigner-02"]
due = "2026-11-27"
approved = "2026-11-01"

[[milestone]]
id = "M-roaddesigner-01"
release = "R-roaddesigner-01"
